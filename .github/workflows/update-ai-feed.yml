name: Update AI Feed

on:
  schedule:
    - cron: "0 6 * * *" # ogni giorno alle 06:00 UTC
  workflow_dispatch: {} # per lanciarlo manualmente da GitHub Actions

permissions:
  contents: write

# Evita che due run (cron + dispatch, o dispatch sovrapposti) si pestino i piedi sul push.
concurrency:
  group: update-ai-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Serve history per rebase se master e' avanzato tra commit e push.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/update_ai_feed.py

      - name: Commit e push se ci sono novità
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/ai_feed.yml
          if git diff --staged --quiet; then
            echo "Nessuna novità nel feed"
            exit 0
          fi
          git commit -m "Aggiorna AI feed"
          # master puo' avanzare (push umano / altro run) tra il checkout e il push:
          # rebase e riprova invece di fallire.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rifiutato (tentativo $attempt), rebase su origin/master..."
            git pull --rebase origin master
          done
          echo "Push fallito dopo 3 tentativi"
          exit 1
